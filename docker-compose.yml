services:
  postgres:
    image: postgres:16-alpine
    container_name: vella-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vella_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-vella_market}
    ports:
      - "5433:5432"
    volumes:
      - vella_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vella -d vella_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development-only mail catcher: OTP emails can be read at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: vella-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  vella_pgdata:
